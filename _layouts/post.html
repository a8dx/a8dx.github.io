<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="post-content">
    {{ content }}
  </div>

  <hr>

  <div class="post-nav">
    <div>
      {% if page.previous.url %}
        <a href="{{ page.previous.url }}">&laquo; {{ page.previous.title }}</a>
      {% endif %}
    </div>
    <div class="post-nav-next">
      {% if page.next.url %}
        <a href="{{ page.next.url }}">{{ page.next.title }} &raquo;</a>
      {% endif %}
    </div>
  </div>
</article>
